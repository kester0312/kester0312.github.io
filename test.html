<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMR Adaptive Threshold Tester</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --border: #334155;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 1.5rem;
      color: var(--accent);
    }

    p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9rem;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      background: var(--panel);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
    }

    input[type="file"] {
      font-size: 0.85rem;
      color: #94a3b8;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .stat-badge {
      font-family: monospace;
      background: #090d16;
      padding: 8px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 0.9rem;
      color: #4ade80;
    }

    .views {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
    }

    .canvas-card {
      background: var(--panel);
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .canvas-card h3 {
      margin: 0 0 12px 0;
      font-size: 1rem;
      width: 100%;
      color: #cbd5e1;
    }

    .canvas-wrapper {
      width: 100%;
      overflow: auto;
      max-height: 70vh;
      display: flex;
      justify-content: center;
      background: #090d16;
      border-radius: 4px;
    }

    canvas {
      max-width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>OMR Adaptive Thresholding Harness</h1>
    <p>Upload a mobile camera photo of an answer sheet with shadow, glare, or uneven light.</p>
  </header>

  <div class="controls">
    <div class="control-group">
      <label for="fileInput">Select Image File</label>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="control-group">
      <label for="windowRatio">
        Window Ratio
        <span id="windowValue" class="stat-badge">0.12</span>
      </label>
      <input type="range" id="windowRatio" min="0.02" max="0.30" step="0.01" value="0.12">
    </div>

    <div class="control-group">
      <label for="sensitivity">
        Sensitivity (T%)
        <span id="sensitivityValue" class="stat-badge">0.15</span>
      </label>
      <input type="range" id="sensitivity" min="0.02" max="0.40" step="0.01" value="0.15">
    </div>

    <div class="control-group">
      <label>Execution Time</label>
      <div id="perfTime" class="stat-badge">0.00 ms</div>
    </div>
  </div>

  <div class="views">
    <div class="canvas-card">
      <h3>Original Image</h3>
      <div class="canvas-wrapper">
        <canvas id="origCanvas"></canvas>
      </div>
    </div>

    <div class="canvas-card">
      <h3>Thresholded Result</h3>
      <div class="canvas-wrapper">
        <canvas id="procCanvas"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
  // Core Bradley-Roth Adaptive Thresholding Function
  function applyAdaptiveThreshold(canvas, windowRatio = 0.12, sensitivity = 0.15) {
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const { width, height } = canvas;
    const imgData = ctx.getImageData(0, 0, width, height);
    const data = imgData.data;
    const pixelCount = width * height;

    const pixels32 = new Uint32Array(data.buffer);
    const grays = new Uint8Array(pixelCount);
    const integral = new Uint32Array(pixelCount);

    // Pass 1: Grayscale + Integral Image Construction
    for (let y = 0; y < height; y++) {
      let rowSum = 0;
      const rowOffset = y * width;
      const prevRowOffset = (y - 1) * width;

      for (let x = 0; x < width; x++) {
        const idx = rowOffset + x;
        const px = idx << 2;

        const gray = (data[px] * 299 + data[px + 1] * 587 + data[px + 2] * 114) / 1000 | 0;
        grays[idx] = gray;

        rowSum += gray;
        integral[idx] = (y === 0) ? rowSum : integral[prevRowOffset + x] + rowSum;
      }
    }

    // Pass 2: Adaptive Thresholding
    const s = Math.max(1, Math.round(width * windowRatio));
    const s2 = s >> 1;
    const factor = 1.0 - sensitivity;

    const WHITE = 0xFFFFFFFF;
    const BLACK = 0xFF000000;

    for (let y = 0; y < height; y++) {
      const y1 = Math.max(0, y - s2);
      const y2 = Math.min(height - 1, y + s2);
      const y1Offset = (y1 - 1) * width;
      const y2Offset = y2 * width;

      for (let x = 0; x < width; x++) {
        const x1 = Math.max(0, x - s2);
        const x2 = Math.min(width - 1, x + s2);

        const count = (x2 - x1 + 1) * (y2 - y1 + 1);

        const D = integral[y2Offset + x2];
        const B = (y1 > 0) ? integral[y1Offset + x2] : 0;
        const C = (x1 > 0) ? integral[y2Offset + (x1 - 1)] : 0;
        const A = (x1 > 0 && y1 > 0) ? integral[y1Offset + (x1 - 1)] : 0;

        const sum = D - B - C + A;
        const idx = y * width + x;

        pixels32[idx] = (grays[idx] * count < sum * factor) ? BLACK : WHITE;
      }
    }

    ctx.putImageData(imgData, 0, 0);
  }

  // DOM Elements & Event Handlers
  const fileInput = document.getElementById('fileInput');
  const windowRatioInput = document.getElementById('windowRatio');
  const sensitivityInput = document.getElementById('sensitivity');
  const windowValue = document.getElementById('windowValue');
  const sensitivityValue = document.getElementById('sensitivityValue');
  const perfTime = document.getElementById('perfTime');

  const origCanvas = document.getElementById('origCanvas');
  const procCanvas = document.getElementById('procCanvas');
  const origCtx = origCanvas.getContext('2d');
  const procCtx = procCanvas.getContext('2d');

  let loadedImage = null;
  let renderDebounceTimer = null;

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const img = new Image();
    img.onload = () => {
      loadedImage = img;
      
      // Set canvas sizes to match original image dimensions
      origCanvas.width = procCanvas.width = img.width;
      origCanvas.height = procCanvas.height = img.height;

      // Draw base image to source canvas
      origCtx.drawImage(img, 0, 0);

      // Trigger threshold processing
      processImage();
    };
    img.src = URL.createObjectURL(file);
  });

  function processImage() {
    if (!loadedImage) return;

    const windowRatio = parseFloat(windowRatioInput.value);
    const sensitivity = parseFloat(sensitivityInput.value);

    windowValue.textContent = windowRatio.toFixed(2);
    sensitivityValue.textContent = sensitivity.toFixed(2);

    // Reset target canvas to raw original image
    procCtx.drawImage(loadedImage, 0, 0);

    // Measure adaptive threshold execution speed
    const t0 = performance.now();
    applyAdaptiveThreshold(procCanvas, windowRatio, sensitivity);
    const t1 = performance.now();

    perfTime.textContent = `${(t1 - t0).toFixed(2)} ms`;
  }

  // Debounced slider handler for smooth real-time tweaking
  function onParamChange() {
    clearTimeout(renderDebounceTimer);
    renderDebounceTimer = setTimeout(processImage, 16);
  }

  windowRatioInput.addEventListener('input', onParamChange);
  sensitivityInput.addEventListener('input', onParamChange);
</script>
</body>
</html>
