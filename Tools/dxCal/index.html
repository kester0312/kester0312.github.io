<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen & Viewport Dimensions</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f9ff;
    }

    .container {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 20dvh;
    }

    .card {
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 20px;
      padding: 30px;
      width: 80dvw;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .section {
      background: #f9f9f9;
      border-left: 4px solid #ffd200;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .dimension-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      background: #ffffff;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .metric-label {
      font-size: 0.75rem;
      color: #555;
    }

    .metric-value {
      font-family: 'Courier New', Courier, monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a1a;
    }
  </style>
</head>

<body>


  <script src="\code/js/header.js"></script>
  <div class="container">
    <div class="card">
      <div class="title">GetPixel</div>

      <!-- Viewport / Web Page Dimensions -->
      <div class="section">
        <div class="section-title">Web Size</div>
        <div class="dimension-grid">
          <div class="metric">
            <div class="metric-label">Width</div>
            <div class="metric-value" id="web-width">0px</div>
          </div>
          <div class="metric">
            <div class="metric-label">Height</div>
            <div class="metric-value" id="web-height">0px</div>
          </div>
        </div>
      </div>

      <!-- Screen Physical Resolution -->
      <div class="section">
        <div class="section-title">Screen Size</div>
        <div class="dimension-grid">
          <div class="metric">
            <div class="metric-label">Width</div>
            <div class="metric-value" id="screen-width">0px</div>
          </div>
          <div class="metric">
            <div class="metric-label">Height</div>
            <div class="metric-value" id="screen-height">0px</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer style="text-align: center; margin-top: 80px; padding-bottom: 40px; color: #BBB; font-size: 0.9rem;">
    &copy; 2026 麥塊藍月光 &bull; kester0312.github.io
  </footer>

  <script>
    function updateDimensions() {
      // Browser viewport dimensions
      document.getElementById('web-width').textContent = window.innerWidth + 'px';
      document.getElementById('web-height').textContent = window.innerHeight + 'px';

      // Device screen resolution
      document.getElementById('screen-width').textContent = screen.width + 'px';
      document.getElementById('screen-height').textContent = screen.height + 'px';
    }

    // Run on load and whenever browser is resized
    window.addEventListener('load', updateDimensions);
    window.addEventListener('resize', updateDimensions);
  </script>

</body>

</html>
