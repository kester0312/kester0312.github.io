<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft dx Calculator</title>
  <link rel="stylesheet" href="\code/css/button.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f9ff;
    }

    .container {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 13dvh;
    }

    .card {
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 20px;
      padding: 30px;
      width: 80dvw;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1a1a1a;
    }

    .section {
      background: #f9f9f9;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      text-align: center;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .dimension-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }

    .metric {
      background: #dcffec;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #eee;
    }

    .metric-label {
      font-size: 0.75rem;
      color: #555;
      margin-bottom: 5px;
    }

    .metric-value input {
      width: 100%;
      max-width: 100px;
      padding: 2px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .metric-value input {
      width: 100%;
      max-width: 100px;
      padding: 2px 2px 2px 0px;
      /* Top Right Bottom Left (15px padding-left shifts text right) */
      font-family: 'Courier New', Courier, monospace;
      font-size: 1rem;
      font-weight: 700;
      color: #1a1a1a;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #dcffec;
    }


    .metric-value input:focus {
      outline: none;
      border-color: #888;
    }

    button {
      cursor: pointer;
      padding: 6px 14px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      background-color: #fff;
      border-radius: 6px;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #eaeaea;
    }
  </style>
</head>

<body>

  <script src="\code/js/header.js"></script>
  <div class="container">
    <div class="card">
      <div class="title">Minecraft dx Calculator</div>

      <!-- Point 1 -->
      <div class="section">
        <div class="section-title">Point 1</div>
        <div class="dimension-grid">
          <div class="metric">
            <div class="metric-label">X</div>
            <div class="metric-value">
              <input type="number" id="x1" placeholder="0">
            </div>
          </div>
          <div class="metric">
            <div class="metric-label">Y</div>
            <div class="metric-value">
              <input type="number" id="y1" placeholder="0">
            </div>
          </div>
          <div class="metric">
            <div class="metric-label">Z</div>
            <div class="metric-value">
              <input type="number" id="z1" placeholder="0">
            </div>
          </div>
        </div>
      </div>

      <!-- Point 2 -->
      <div class="section">
        <div class="section-title">Point 2</div>
        <div class="dimension-grid">
          <div class="metric">
            <div class="metric-label">X</div>
            <div class="metric-value">
              <input type="number" id="x2" placeholder="0">
            </div>
          </div>
          <div class="metric">
            <div class="metric-label">Y</div>
            <div class="metric-value">
              <input type="number" id="y2" placeholder="0">
            </div>
          </div>
          <div class="metric">
            <div class="metric-label">Z</div>
            <div class="metric-value">
              <input type="number" id="z2" placeholder="0">
            </div>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div class="section">
        <div class="section-title">Result</div>
        <div style="align-items: center; display: flex; justify-content: center;">
          <p id="web-result">x=0,dx=0,y=0,dy=0,z=0,dz=0</p>
          <p style="padding-right: 15px;"></p>
          <button class="buttonstyle" type="button" id="add" onclick="copyResult()" style="padding: 4px 10px; border-radius: 9px; transform: translateY(3.5px);">
            Copy
          </button>
        </div>
      </div>
    </div>
  </div>

  <footer style="text-align: center; margin-top: 80px; padding-bottom: 40px; color: #BBB; font-size: 0.9rem;">
    &copy; 2026 麥塊藍月光 &bull; kester0312.github.io
  </footer>

  <script>
    function calculateCoordinates() {
      const axes = ['x', 'y', 'z'];
      let resultParts = [];

      axes.forEach(axis => {
        const v1 = parseFloat(document.getElementById(axis + '1').value) || 0;
        const v2 = parseFloat(document.getElementById(axis + '2').value) || 0;

        const minVal = Math.min(v1, v2);
        const diffVal = Math.abs(v1 - v2);

        resultParts.push(`${axis}=${minVal},d${axis}=${diffVal}`);
      });

      document.getElementById('web-result').textContent = resultParts.join(',');
    }

    document.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', calculateCoordinates);
    });

    function copyResult() {
      const textToCopy = document.getElementById('web-result').textContent;
      navigator.clipboard.writeText(textToCopy).then(() => {
        alert("Copied: " + textToCopy);
      }).catch(err => {
        console.error('Failed to copy text: ', err);
      });
    }
  </script>

</body>

</html>
