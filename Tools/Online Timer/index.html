<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- Prevents user zoom and auto-scaling on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exam Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation; /* Disables double-tap to zoom on iOS/Android */
    }

    body {
      background-color: #ffffff;
      color: #222222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Container padding reduced to 4px (20% of original 20px) */
    .container {
      background: #ffffff;
      width: 100vw;
      height: 100vh;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .timer-layout {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 12px;
      overflow: hidden;
    }

    .part-clock {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Increased clock size */
    .clock-wrapper {
      width: min(82vmin, 680px);
      height: min(82vmin, 680px);
      background-image: url('clock.png');
      background-size: cover;
      background-position: center;
      border-radius: 50%;
      position: relative;
    }

    .real-clock {
      width: 100%;
      height: 100%;
    }

    /* Scrollable settings panel for smaller screen height */
    .part-setup,
    .part-info {
      flex: 1;
      width: 100%;
      max-width: 420px;
      max-height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding: 12px 16px;
      transition: max-width 0.3s ease;
    }

    /* Full screen / centered layout when clock is hidden */
    .part-setup.full-width,
    .part-info.full-width {
      max-width: 580px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      color: inherit;
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    /* Compact Spinner Controls */
    .time-input-container {
      display: flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .number-spinner {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      width: 62px;
    }

    .number-spinner input[type="number"] {
      width: 38px;
      padding: 4px 2px;
      border: none;
      outline: none;
      font-size: 16px; /* Prevents iOS auto-zoom */
      text-align: center;
      background: transparent;
      color: inherit;
      -moz-appearance: textfield;
    }

    .number-spinner input::-webkit-outer-spin-button,
    .number-spinner input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .spinner-arrows {
      display: flex;
      flex-direction: column;
      width: 24px;
      border-left: 1px solid #ccc;
    }

    .spin-btn {
      background: #f0f0f0;
      border: none;
      cursor: pointer;
      font-size: 0.65rem;
      height: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      color: #333;
    }

    .spin-btn:first-child {
      border-bottom: 1px solid #ccc;
    }

    .spin-btn:hover {
      background: #e0e0e0;
    }

    .separator {
      font-weight: bold;
      font-size: 1.1rem;
      color: #555;
    }

    .unit-label {
      font-size: 0.85rem;
      color: #666;
      margin-right: 6px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      text-align: left;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: inherit;
      cursor: pointer;
      font-weight: normal;
    }

    .checkbox-label input[type="checkbox"]:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .checkbox-label.disabled {
      color: #aaa;
      cursor: not-allowed;
    }

    .test-sound-btn {
      align-self: flex-start;
      margin-top: 4px;
      padding: 6px 14px;
      background-color: #6c757d;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .test-sound-btn:hover {
      background-color: #5a6268;
    }

    .info-preview {
      margin: 12px 0;
      font-size: 0.95rem;
      color: inherit;
      font-weight: 600;
      min-height: 1.2em;
    }

    .error-msg {
      color: #d9534f;
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
    }

    button.primary-btn {
      width: 100%;
      padding: 12px;
      background-color: #222222;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.primary-btn:hover {
      background-color: #444444;
    }

    .status-badge-container {
      margin-bottom: 12px;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .status-waiting {
      background: #ffeeba;
      color: #856404;
    }

    .status-running {
      background: #d4edda;
      color: #155724;
    }

    .status-ended {
      background: #f8d7da;
      color: #721c24;
    }

    .time-range {
      font-size: 1.15rem;
      font-weight: 600;
      color: inherit;
      margin-bottom: 8px;
      text-align: center;
    }

    .real-time-container {
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
    }

    .real-time {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: inherit;
    }

    .countdown-container {
      height: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .countdown-display {
      font-size: 1.25rem;
      font-weight: 600;
      color: #d9534f;
    }

    .invisible {
      visibility: hidden !important;
    }

    .timer-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 12px;
      width: 100%;
    }

    /* Dark Mode Support */
    @media (prefers-color-scheme: dark) {
      body, .container {
        background-color: #000000;
        color: #ffffff;
      }

      label, .separator, .unit-label {
        color: #aaaaaa;
      }

      .number-spinner {
        background: #1e1e1e;
        border-color: #444444;
      }

      .spinner-arrows {
        border-left-color: #444444;
      }

      .spin-btn {
        background: #2a2a2a;
        color: #ffffff;
      }

      .spin-btn:first-child {
        border-bottom-color: #444444;
      }

      .spin-btn:hover {
        background: #3a3a3a;
      }

      button.primary-btn {
        background-color: #ffffff;
        color: #000000;
      }

      button.primary-btn:hover {
        background-color: #dddddd;
      }

      .timer-controls {
        border-top-color: #333333;
      }

      /* Kept center post dark in dark mode */
      .clock-center-dot {
        fill: #222222 !important;
      }
    }
  </style>
</head>

<body>

    <script src="\code/js/header_TopLeft.js"></script>

  <div class="container" id="mainContainer">
    <div class="timer-layout" id="timerLayout">
      <!-- Left Half: Maximized Analog Clock -->
      <div class="part-clock" id="partClock">
        <div class="clock-wrapper">
          <svg class="real-clock" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="47" fill="none" stroke="none" />
            <line id="hourHand" x1="50" y1="50" x2="50" y2="28" stroke="#222" stroke-width="4" stroke-linecap="round" />
            <line id="minuteHand" x1="50" y1="50" x2="50" y2="18" stroke="#0066cc" stroke-width="3" stroke-linecap="round" />
            <line id="secondHand" x1="50" y1="50" x2="50" y2="12" stroke="#d9534f" stroke-width="1.5" />
            <circle class="clock-center-dot" cx="50" cy="50" r="3.5" fill="#222" />
          </svg>
        </div>
      </div>

      <!-- Right Half: Input Setup Panel -->
      <div id="setupPanel" class="part-setup">
        <h1>Exam Timer</h1>

        <div class="form-group">
          <label class="checkbox-label" style="margin-bottom: 10px; font-weight: 600;">
            <input type="checkbox" id="startAtExactTime" checked>
            Start at exact time
          </label>

          <!-- Displayed when Start at exact time IS TICKED -->
          <div id="exactTimeBlock">
            <label>Exam Start Time (24-Hour Clock)</label>
            <div class="time-input-container">
              <div class="number-spinner">
                <input type="number" id="startHours" min="0" max="23" placeholder="HH">
                <div class="spinner-arrows">
                  <button type="button" class="spin-btn" onclick="adjustValue('startHours', 1)">▲</button>
                  <button type="button" class="spin-btn" onclick="adjustValue('startHours', -1)">▼</button>
                </div>
              </div>
              <span class="separator">:</span>
              <div class="number-spinner">
                <input type="number" id="startMinutes" min="0" max="59" placeholder="MM">
                <div class="spinner-arrows">
                  <button type="button" class="spin-btn" onclick="adjustValue('startMinutes', 1)">▲</button>
                  <button type="button" class="spin-btn" onclick="adjustValue('startMinutes', -1)">▼</button>
                </div>
              </div>
            </div>
          </div>

          <!-- Displayed when Start at exact time IS UNTICKED -->
          <div id="delayTimeBlock" style="display: none;">
            <label>Start Delay</label>
            <div class="time-input-container">
              <div class="number-spinner">
                <input type="number" id="delayHours" min="0" value="0" placeholder="HH">
                <div class="spinner-arrows">
                  <button type="button" class="spin-btn" onclick="adjustValue('delayHours', 1)">▲</button>
                  <button type="button" class="spin-btn" onclick="adjustValue('delayHours', -1)">▼</button>
                </div>
              </div>
              <span class="unit-label">hr</span>

              <div class="number-spinner">
                <input type="number" id="delayMinutes" min="0" value="0" placeholder="MM">
                <div class="spinner-arrows">
                  <button type="button" class="spin-btn" onclick="adjustValue('delayMinutes', 1)">▲</button>
                  <button type="button" class="spin-btn" onclick="adjustValue('delayMinutes', -1)">▼</button>
                </div>
              </div>
              <span class="unit-label">min</span>

              <div class="number-spinner">
                <input type="number" id="delaySeconds" min="0" value="0" placeholder="SS">
                <div class="spinner-arrows">
                  <button type="button" class="spin-btn" onclick="adjustValue('delaySeconds', 1)">▲</button>
                  <button type="button" class="spin-btn" onclick="adjustValue('delaySeconds', -1)">▼</button>
                </div>
              </div>
              <span class="unit-label">sec</span>
            </div>
          </div>

          <div class="error-msg" id="timeError">Start time cannot be earlier than or equal to current time.</div>
        </div>

        <!-- Default Exam Duration: 105 minutes (1 hr 45 min) -->
        <div class="form-group">
          <label>Exam Duration</label>
          <div class="time-input-container">
            <div class="number-spinner">
              <input type="number" id="durationHours" min="0" value="1" placeholder="HH">
              <div class="spinner-arrows">
                <button type="button" class="spin-btn" onclick="adjustValue('durationHours', 1)">▲</button>
                <button type="button" class="spin-btn" onclick="adjustValue('durationHours', -1)">▼</button>
              </div>
            </div>
            <span class="unit-label">hr</span>

            <div class="number-spinner">
              <input type="number" id="durationMinutes" min="0" value="45" placeholder="MM">
              <div class="spinner-arrows">
                <button type="button" class="spin-btn" onclick="adjustValue('durationMinutes', 1)">▲</button>
                <button type="button" class="spin-btn" onclick="adjustValue('durationMinutes', -1)">▼</button>
              </div>
            </div>
            <span class="unit-label">min</span>

            <div class="number-spinner">
              <input type="number" id="durationSeconds" min="0" value="0" placeholder="SS">
              <div class="spinner-arrows">
                <button type="button" class="spin-btn" onclick="adjustValue('durationSeconds', 1)">▲</button>
                <button type="button" class="spin-btn" onclick="adjustValue('durationSeconds', -1)">▼</button>
              </div>
            </div>
            <span class="unit-label">sec</span>
          </div>
        </div>

        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="setupShowClock" checked>
            Show Clock
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="setupStartStopAnnounce" checked>
            Start/Stop announce
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="setupRealTime">
            Show digital real-time clock (HH:MM:SS)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="setupCountdown">
            Show remaining time countdown
          </label>
          <label class="checkbox-label" id="fifteenMinLabel">
            <input type="checkbox" id="announce15Min" checked>
            15 mins left announce
          </label>
          <button type="button" class="test-sound-btn" onclick="testSound()">Test Sound</button>
        </div>

        <div class="info-preview" id="schedulePreview">Exam Period: --:-- - --:--</div>

        <button id="startBtn" class="primary-btn">Start</button>
      </div>

      <!-- Right Half: Active Timer Information Panel -->
      <div id="activeInfoPanel" class="part-info" style="display: none;">
        <div class="status-badge-container">
          <div id="statusBadge" class="status-badge status-waiting">Waiting to start</div>
        </div>

        <div class="time-range" id="examTimeRange">Exam Period: --:-- - --:--</div>

        <div class="real-time-container">
          <div class="real-time" id="realTimeDisplay">00:00:00</div>
        </div>

        <div class="countdown-container">
          <div class="countdown-display" id="countdownDisplay"></div>
        </div>

        <div class="timer-controls">
          <label class="checkbox-label">
            <input type="checkbox" id="timerShowClock" checked>
            Show Clock
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="timerStartStopAnnounce" checked>
            Start/Stop announce
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="timerRealTime">
            Show real-time (HH:MM:SS)
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="timerCountdown">
            Show remaining time countdown
          </label>
          <label class="checkbox-label" id="timerFifteenMinLabel">
            <input type="checkbox" id="timerAnnounce15Min">
            15 mins left announce
          </label>
          <button type="button" class="test-sound-btn" onclick="testSound()">Test Sound</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Prevent gesture zoom on iOS devices
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });

    // Elements
    const partClock = document.getElementById('partClock');
    const setupPanel = document.getElementById('setupPanel');
    const activeInfoPanel = document.getElementById('activeInfoPanel');
    const timerLayout = document.getElementById('timerLayout');

    const startAtExactTime = document.getElementById('startAtExactTime');
    const exactTimeBlock = document.getElementById('exactTimeBlock');
    const delayTimeBlock = document.getElementById('delayTimeBlock');

    const startHoursInput = document.getElementById('startHours');
    const startMinutesInput = document.getElementById('startMinutes');

    const delayHoursInput = document.getElementById('delayHours');
    const delayMinutesInput = document.getElementById('delayMinutes');
    const delaySecondsInput = document.getElementById('delaySeconds');

    const durationHoursInput = document.getElementById('durationHours');
    const durationMinutesInput = document.getElementById('durationMinutes');
    const durationSecondsInput = document.getElementById('durationSeconds');

    const schedulePreview = document.getElementById('schedulePreview');
    const timeError = document.getElementById('timeError');
    const startBtn = document.getElementById('startBtn');

    // Checkboxes
    const setupShowClock = document.getElementById('setupShowClock');
    const setupStartStopAnnounce = document.getElementById('setupStartStopAnnounce');
    const setupRealTime = document.getElementById('setupRealTime');
    const setupCountdown = document.getElementById('setupCountdown');
    const announce15Min = document.getElementById('announce15Min');
    const fifteenMinLabel = document.getElementById('fifteenMinLabel');

    const timerShowClock = document.getElementById('timerShowClock');
    const timerStartStopAnnounce = document.getElementById('timerStartStopAnnounce');
    const timerRealTime = document.getElementById('timerRealTime');
    const timerCountdown = document.getElementById('timerCountdown');
    const timerAnnounce15Min = document.getElementById('timerAnnounce15Min');
    const timerFifteenMinLabel = document.getElementById('timerFifteenMinLabel');

    // Displays
    const realTimeDisplay = document.getElementById('realTimeDisplay');
    const examTimeRange = document.getElementById('examTimeRange');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const statusBadge = document.getElementById('statusBadge');

    // Clock Hands
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');

    let examStart = null;
    let examEnd = null;
    let bellRung = false;
    let startAnnounced = false;
    let announcement15Triggered = false;
    let announcement5Triggered = false;

    // iOS Web Audio Context & Preloading
    let globalAudioCtx = null;
    const audioCache = {};

    function unlockAudioForIOS() {
      if (!globalAudioCtx) {
        globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (globalAudioCtx.state === 'suspended') {
        globalAudioCtx.resume();
      }

      if ('speechSynthesis' in window) {
        const silentSpeech = new SpeechSynthesisUtterance('');
        silentSpeech.volume = 0;
        window.speechSynthesis.speak(silentSpeech);
      }

      const files = ['15_mins_left.mp3', '5_mins_left.mp3'];
      files.forEach(filename => {
        if (!audioCache[filename]) {
          const audio = new Audio(filename);
          audio.muted = true;
          audio.load();
          audio.play().then(() => {
            audio.pause();
            audio.currentTime = 0;
          }).catch(() => { });
          audioCache[filename] = audio;
        }
      });
    }

    function testSound() {
      speakText("Test");
    }

    function updateClockPosition() {
      const webWidth = window.innerWidth;
      const webHeight = window.innerHeight;

      if (webWidth > webHeight) {
        timerLayout.style.flexDirection = 'row';
      } else {
        timerLayout.style.flexDirection = 'column';
      }
    }

    function toggleShowClock() {
      const isVisible = setupShowClock.checked;
      if (isVisible) {
        partClock.style.display = 'flex';
        setupPanel.classList.remove('full-width');
        activeInfoPanel.classList.remove('full-width');
      } else {
        partClock.style.display = 'none';
        setupPanel.classList.add('full-width');
        activeInfoPanel.classList.add('full-width');
      }
    }

    window.addEventListener('load', updateClockPosition);
    window.addEventListener('resize', updateClockPosition);

    // Sync Checkboxes
    setupShowClock.addEventListener('change', () => { timerShowClock.checked = setupShowClock.checked; toggleShowClock(); });
    setupStartStopAnnounce.addEventListener('change', () => { timerStartStopAnnounce.checked = setupStartStopAnnounce.checked; });
    setupRealTime.addEventListener('change', () => { timerRealTime.checked = setupRealTime.checked; });
    setupCountdown.addEventListener('change', () => { timerCountdown.checked = setupCountdown.checked; });
    announce15Min.addEventListener('change', () => { timerAnnounce15Min.checked = announce15Min.checked; });

    timerShowClock.addEventListener('change', () => { setupShowClock.checked = timerShowClock.checked; toggleShowClock(); });
    timerStartStopAnnounce.addEventListener('change', () => { setupStartStopAnnounce.checked = timerStartStopAnnounce.checked; });
    timerRealTime.addEventListener('change', () => { setupRealTime.checked = timerRealTime.checked; tick(); });
    timerCountdown.addEventListener('change', () => { setupCountdown.checked = timerCountdown.checked; tick(); });
    timerAnnounce15Min.addEventListener('change', () => { announce15Min.checked = timerAnnounce15Min.checked; });

    // Handle "Start at exact time" checkbox state
    function toggleStartExactUI() {
      const isExact = startAtExactTime.checked;
      if (isExact) {
        exactTimeBlock.style.display = 'block';
        delayTimeBlock.style.display = 'none';
      } else {
        exactTimeBlock.style.display = 'none';
        delayTimeBlock.style.display = 'block';
      }
      updatePreview();
    }

    startAtExactTime.addEventListener('change', toggleStartExactUI);

    function adjustValue(inputId, delta) {
      const input = document.getElementById(inputId);
      let val = (parseInt(input.value, 10) || 0) + delta;
      input.value = val;
      normalizeInputs();
    }

    function normalizeInputs() {
      let sH = parseInt(startHoursInput.value, 10) || 0;
      let sM = parseInt(startMinutesInput.value, 10) || 0;

      let delH = parseInt(delayHoursInput.value, 10) || 0;
      let delM = parseInt(delayMinutesInput.value, 10) || 0;
      let delS = parseInt(delaySecondsInput.value, 10) || 0;

      let dH = parseInt(durationHoursInput.value, 10) || 0;
      let dM = parseInt(durationMinutesInput.value, 10) || 0;
      let dS = parseInt(durationSecondsInput.value, 10) || 0;

      // Start Time Normalization
      if (sM >= 60) {
        sH += Math.floor(sM / 60);
        sM = sM % 60;
      } else if (sM < 0) {
        sM = 0;
      }
      sH = ((sH % 24) + 24) % 24;

      // Start Delay Normalization
      if (delS >= 60) {
        delM += Math.floor(delS / 60);
        delS = delS % 60;
      } else if (delS < 0) {
        delS = 0;
      }
      if (delM >= 60) {
        delH += Math.floor(delM / 60);
        delM = delM % 60;
      } else if (delM < 0) {
        delM = 0;
      }
      if (delH < 0) delH = 0;

      // Duration Normalization
      if (dS >= 60) {
        dM += Math.floor(dS / 60);
        dS = dS % 60;
      } else if (dS < 0) {
        dS = 0;
      }
      if (dM >= 60) {
        dH += Math.floor(dM / 60);
        dM = dM % 60;
      } else if (dM < 0) {
        dM = 0;
      }
      if (dH < 0) dH = 0;

      startHoursInput.value = String(sH).padStart(2, '0');
      startMinutesInput.value = String(sM).padStart(2, '0');

      delayHoursInput.value = String(delH);
      delayMinutesInput.value = String(delM).padStart(2, '0');
      delaySecondsInput.value = String(delS).padStart(2, '0');

      durationHoursInput.value = String(dH);
      durationMinutesInput.value = String(dM).padStart(2, '0');
      durationSecondsInput.value = String(dS).padStart(2, '0');

      const totalMins = (dH * 60) + dM + (dS / 60);
      if (totalMins < 16) {
        announce15Min.checked = false;
        announce15Min.disabled = true;
        fifteenMinLabel.classList.add('disabled');

        timerAnnounce15Min.checked = false;
        timerAnnounce15Min.disabled = true;
        timerFifteenMinLabel.classList.add('disabled');
      } else {
        announce15Min.disabled = false;
        fifteenMinLabel.classList.remove('disabled');

        timerAnnounce15Min.disabled = false;
        timerFifteenMinLabel.classList.remove('disabled');
      }

      updatePreview();
    }

    function setInitialStartTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      startHoursInput.value = String(now.getHours()).padStart(2, '0');
      startMinutesInput.value = String(now.getMinutes()).padStart(2, '0');
      normalizeInputs();
    }

    function formatTimeString(date) {
      return date.toTimeString().split(' ')[0];
    }

    function formatShortTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = date.getSeconds();
      return s > 0 ? `${h}:${m}:${String(s).padStart(2, '0')}` : `${h}:${m}`;
    }

    function numberToWords(n) {
      const ones = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
        "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
      const tens = ["", "", "twenty", "thirty", "forty", "fifty"];

      if (n < 20) return ones[n];
      const t = Math.floor(n / 10);
      const o = n % 10;
      return tens[t] + (o > 0 ? " " + ones[o] : "");
    }

    function timeToSpokenWords24(date) {
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const seconds = date.getSeconds();

      const hourStr = numberToWords(hours);
      let minStr = "";
      let secStr = "";

      if (minutes === 0 && seconds === 0) {
        return `${hourStr} o'clock`;
      }

      if (minutes === 0 && seconds !== 0) {
        minStr = "zero";
      } else if (minutes < 10) {
        minStr = "oh " + numberToWords(minutes);
      } else {
        minStr = numberToWords(minutes);
      }

      if (seconds !== 0) {
        if (seconds < 10) {
          secStr = " oh " + numberToWords(seconds);
        } else {
          secStr = " " + numberToWords(seconds);
        }
      }

      return `${hourStr} ${minStr}${secStr}`.trim();
    }

    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    function playAudioFile(filename) {
      if (audioCache[filename]) {
        audioCache[filename].muted = false;
        audioCache[filename].volume = 1.0;
        audioCache[filename].currentTime = 0;
        audioCache[filename].play().catch(e => console.log("Audio play blocked:", filename, e));
      } else {
        const audio = new Audio(filename);
        audio.play().catch(e => console.log("Audio play blocked:", filename, e));
      }
    }

    // Calculates exact exam dates; incorporates exact millisecond precision
    function getExamDates() {
      const dH = parseInt(durationHoursInput.value, 10) || 0;
      const dM = parseInt(durationMinutesInput.value, 10) || 0;
      const dS = parseInt(durationSecondsInput.value, 10) || 0;
      const totalDurationMs = ((dH * 3600) + (dM * 60) + dS) * 1000;

      let start = new Date();

      if (startAtExactTime.checked) {
        const sH = parseInt(startHoursInput.value, 10) || 0;
        const sM = parseInt(startMinutesInput.value, 10) || 0;
        start.setHours(sH, sM, 0, 0);
      } else {
        const now = new Date();
        const nextSecondBoundaryMs = Math.ceil(now.getTime() / 1000) * 1000;

        const delH = parseInt(delayHoursInput.value, 10) || 0;
        const delM = parseInt(delayMinutesInput.value, 10) || 0;
        const delS = parseInt(delaySecondsInput.value, 10) || 0;
        const totalDelayMs = ((delH * 3600) + (delM * 60) + delS) * 1000;

        start = new Date(nextSecondBoundaryMs + totalDelayMs);
      }

      const end = new Date(start.getTime() + totalDurationMs);
      return { start, end };
    }

    function updatePreview() {
      if (startAtExactTime.checked) {
        const { start, end } = getExamDates();
        schedulePreview.textContent = `Exam Period: ${formatShortTime(start)} - ${formatShortTime(end)}`;
      } else {
        const delH = String(parseInt(delayHoursInput.value, 10) || 0).padStart(2, '0');
        const delM = String(parseInt(delayMinutesInput.value, 10) || 0).padStart(2, '0');
        const delS = String(parseInt(delaySecondsInput.value, 10) || 0).padStart(2, '0');
        schedulePreview.textContent = `Exam Period: Start after ${delH}:${delM}:${delS}`;
      }
    }

    function ringBell() {
      try {
        if (!globalAudioCtx) {
          globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (globalAudioCtx.state === 'suspended') {
          globalAudioCtx.resume();
        }

        const osc = globalAudioCtx.createOscillator();
        const gain = globalAudioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, globalAudioCtx.currentTime);
        gain.gain.setValueAtTime(1, globalAudioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, globalAudioCtx.currentTime + 3);

        osc.connect(gain);
        gain.connect(globalAudioCtx.destination);

        osc.start();
        osc.stop(globalAudioCtx.currentTime + 3);
      } catch (e) {
        console.log("Audio error", e);
      }
    }

    // 1000ms discrete tick rendering
    function updateAnalogClock(now) {
      const seconds = now.getSeconds();
      const minutes = now.getMinutes() + seconds / 60;
      const hours = (now.getHours() % 12) + minutes / 60;

      const secDeg = seconds * 6;
      const minDeg = minutes * 6;
      const hourDeg = hours * 30;

      secondHand.setAttribute('transform', `rotate(${secDeg}, 50, 50)`);
      minuteHand.setAttribute('transform', `rotate(${minDeg}, 50, 50)`);
      hourHand.setAttribute('transform', `rotate(${hourDeg}, 50, 50)`);
    }

    function startTimer() {
      unlockAudioForIOS();
      normalizeInputs();

      const now = new Date();
      const { start, end } = getExamDates();

      if (startAtExactTime.checked && start <= now) {
        timeError.style.display = 'block';
        return;
      }

      timeError.style.display = 'none';
      examStart = start;
      examEnd = end;
      bellRung = false;
      startAnnounced = false;
      announcement15Triggered = false;
      announcement5Triggered = false;

      setupPanel.style.display = 'none';
      activeInfoPanel.style.display = 'flex';

      examTimeRange.textContent = `Exam Period: ${formatShortTime(examStart)} - ${formatShortTime(examEnd)}`;
      tick();
    }

    function tick() {
      const now = new Date();
      updateAnalogClock(now);

      if (!examStart) return;

      if (timerRealTime.checked) {
        realTimeDisplay.classList.remove('invisible');
        realTimeDisplay.textContent = formatTimeString(now);
      } else {
        realTimeDisplay.classList.add('invisible');
      }

      const isCountdownVisible = timerCountdown.checked;
      const isAnnounceEnabled = timerStartStopAnnounce.checked;

      if (now < examStart) {
        statusBadge.textContent = "Waiting to start";
        statusBadge.className = "status-badge status-waiting";
        if (isCountdownVisible) {
          countdownDisplay.classList.remove('invisible');
          const diffMs = examStart - now;
          countdownDisplay.textContent = `Starts in ${formatDuration(diffMs)}`;
        } else {
          countdownDisplay.classList.add('invisible');
        }
      } else if (now >= examStart && now < examEnd) {
        statusBadge.textContent = "Exam in progress";
        statusBadge.className = "status-badge status-running";

        if (!startAnnounced) {
          startAnnounced = true;
          if (isAnnounceEnabled) {
            const nowSpoken = timeToSpokenWords24(examStart);
            const finishSpoken = timeToSpokenWords24(examEnd);
            const startMessage = `The time now is ${nowSpoken}, the finishing time is ${finishSpoken}, you may start now.`;
            speakText(startMessage);
          } else {
            ringBell();
          }
        }

        const remainingMs = examEnd - now;
        const remainingSeconds = Math.floor(remainingMs / 1000);

        if (timerAnnounce15Min.checked && !announcement15Triggered && remainingSeconds <= 900 && remainingSeconds > 895) {
          announcement15Triggered = true;
          playAudioFile('15_mins_left.mp3');
        }

        if (timerAnnounce15Min.checked && !announcement5Triggered && remainingSeconds <= 300 && remainingSeconds > 295) {
          announcement5Triggered = true;
          playAudioFile('5_mins_left.mp3');
        }

        if (isCountdownVisible) {
          countdownDisplay.classList.remove('invisible');
          countdownDisplay.textContent = `You have ${formatDuration(remainingMs)} left`;
        } else {
          countdownDisplay.classList.add('invisible');
        }
      } else {
        statusBadge.textContent = "Exam Completed";
        statusBadge.className = "status-badge status-ended";

        if (isCountdownVisible) {
          countdownDisplay.classList.remove('invisible');
          countdownDisplay.textContent = "Time's up!";
        } else {
          countdownDisplay.classList.add('invisible');
        }

        if (!bellRung) {
          if (isAnnounceEnabled) {
            const endMessage = "Time is up, stop working, put down all your stationery.";
            speakText(endMessage);
          } else {
            ringBell();
          }
          bellRung = true;
        }
      }
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Input listeners
    [
      startHoursInput, startMinutesInput,
      delayHoursInput, delayMinutesInput, delaySecondsInput,
      durationHoursInput, durationMinutesInput, durationSecondsInput
    ].forEach(input => {
      input.addEventListener('change', normalizeInputs);
      input.addEventListener('blur', normalizeInputs);
      input.addEventListener('input', updatePreview);
    });

    startBtn.addEventListener('click', startTimer);

    // Initial setup
    setInitialStartTime();
    toggleStartExactUI();
    toggleShowClock();

    // Millisecond-synchronized 1000ms interval loop for exact time accuracy
    function scheduleAccurateTick() {
      tick();
      const now = new Date();
      const delay = 1000 - now.getMilliseconds();
      setTimeout(scheduleAccurateTick, delay);
    }

    scheduleAccurateTick();
  </script>
</body>
