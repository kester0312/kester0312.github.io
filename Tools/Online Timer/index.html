<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Real-Time Clock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Entire page background turns white when timer is active */
    body.timer-active {
      background-color: #ffffff;
      padding: 0;
      margin: 0;
      overflow: hidden;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Active State: Card design completely removed, fills browser viewport seamlessly */
    .container.timer-active {
      max-width: none;
      max-height: none;
      width: 100vw;
      height: 100vh;
      box-shadow: none;
      border-radius: 0;
      background: #ffffff;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #333;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    /* Custom Spinner Controls */
    .time-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .number-spinner {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      width: 90px;
    }

    .number-spinner input[type="number"] {
      width: 55px;
      padding: 8px;
      border: none;
      outline: none;
      font-size: 1.1rem;
      text-align: center;
      -moz-appearance: textfield;
    }

    .number-spinner input::-webkit-outer-spin-button,
    .number-spinner input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .spinner-arrows {
      display: flex;
      flex-direction: column;
      width: 35px;
      border-left: 1px solid #ccc;
    }

    .spin-btn {
      background: #f0f0f0;
      border: none;
      cursor: pointer;
      font-size: 0.65rem;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      color: #333;
    }

    .spin-btn:first-child {
      border-bottom: 1px solid #ccc;
    }

    .spin-btn:hover {
      background: #e0e0e0;
    }

    .separator {
      font-weight: bold;
      font-size: 1.2rem;
      color: #555;
    }

    .unit-label {
      font-size: 0.85rem;
      color: #666;
      margin-right: 8px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
      text-align: left;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #444;
      cursor: pointer;
      font-weight: normal;
    }

    .checkbox-label input[type="checkbox"]:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .checkbox-label.disabled {
      color: #aaa;
      cursor: not-allowed;
    }

    .info-preview {
      margin: 15px 0;
      font-size: 0.95rem;
      color: #0066cc;
      font-weight: 500;
      min-height: 1.2em;
    }

    .error-msg {
      color: #d9534f;
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
    }

    button.primary-btn {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.primary-btn:hover {
      background-color: #0052a3;
    }

    /* Active Timer Panel Layout */
    #timerPanel {
      display: none;
      width: 100%;
      height: 100%;
    }

    /* Layout direction strictly handled by JavaScript via Web Size (innerWidth vs innerHeight) */
    .timer-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      width: 100%;
      height: 100%;
      gap: 15px;
    }

    /* Part 1: Maximized Clock Container */
    .part-clock {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .clock-wrapper {
      /* Scales fluidly using web viewport units (vmin) */
      width: min(65vmin, 520px);
      height: min(65vmin, 520px);
      background-image: url('clock.png');
      background-size: cover;
      background-position: center;
      border-radius: 50%;
      position: relative;
    }

    .real-clock {
      width: 100%;
      height: 100%;
    }

    /* Part 2: Info & Controls - Text Max-Width Constraint */
    .part-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 380px;
    }

    .status-badge-container {
      margin-bottom: 12px;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .status-waiting { background: #ffeeba; color: #856404; }
    .status-running { background: #d4edda; color: #155724; }
    .status-ended { background: #f8d7da; color: #721c24; }

    .time-range {
      font-size: 1.15rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 8px;
    }

    .real-time-container {
      height: 3.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 5px;
    }

    .real-time {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: #222;
    }

    .countdown-container {
      height: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .countdown-display {
      font-size: 1.25rem;
      font-weight: 600;
      color: #d9534f;
    }

    .invisible {
      visibility: hidden !important;
    }

    .timer-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-top: 10px;
      border-top: 1px solid #eee;
      padding-top: 12px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <h1 id="mainHeader">Exam Real-Time Clock</h1>

    <!-- Input Setup Section -->
    <div id="setupPanel">
      <div class="form-group">
        <label>Exam Start Time (24-Hour Clock)</label>
        <div class="time-input-container">
          <div class="number-spinner">
            <input type="number" id="startHours" min="0" max="23" placeholder="HH">
            <div class="spinner-arrows">
              <button type="button" class="spin-btn" onclick="adjustValue('startHours', 1)">▲</button>
              <button type="button" class="spin-btn" onclick="adjustValue('startHours', -1)">▼</button>
            </div>
          </div>
          <span class="separator">:</span>
          <div class="number-spinner">
            <input type="number" id="startMinutes" min="0" max="59" placeholder="MM">
            <div class="spinner-arrows">
              <button type="button" class="spin-btn" onclick="adjustValue('startMinutes', 1)">▲</button>
              <button type="button" class="spin-btn" onclick="adjustValue('startMinutes', -1)">▼</button>
            </div>
          </div>
          <span class="separator">:</span>
          <!-- Seconds Spinner Defaults to 00 with arrow toggling -->
          <div class="number-spinner">
            <input type="number" id="startSeconds" value="00" readonly>
            <div class="spinner-arrows">
              <button type="button" class="spin-btn" onclick="toggleHalfMinute()">▲</button>
              <button type="button" class="spin-btn" onclick="toggleHalfMinute()">▼</button>
            </div>
          </div>
        </div>
        <div class="error-msg" id="timeError">Start time cannot be earlier than or equal to the current time. Please select a future time.</div>
      </div>

      <div class="form-group">
        <label>Exam Duration</label>
        <div class="time-input-container">
          <div class="number-spinner">
            <input type="number" id="durationHours" min="0" value="0" placeholder="HH">
            <div class="spinner-arrows">
              <button type="button" class="spin-btn" onclick="adjustValue('durationHours', 1)">▲</button>
              <button type="button" class="spin-btn" onclick="adjustValue('durationHours', -1)">▼</button>
            </div>
          </div>
          <span class="unit-label">hr</span>

          <div class="number-spinner">
            <input type="number" id="durationMinutes" min="0" value="34" placeholder="MM">
            <div class="spinner-arrows">
              <button type="button" class="spin-btn" onclick="adjustValue('durationMinutes', 1)">▲</button>
              <button type="button" class="spin-btn" onclick="adjustValue('durationMinutes', -1)">▼</button>
            </div>
          </div>
          <span class="unit-label">min</span>
        </div>
      </div>

      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="setupRealTime" checked>
          Show digital real-time clock (HH:MM:SS)
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="setupCountdown">
          Show remaining time countdown
        </label>
        <label class="checkbox-label" id="fifteenMinLabel">
          <input type="checkbox" id="announce15Min">
          15 mins left announce
        </label>
      </div>

      <div class="info-preview" id="schedulePreview">Exam Period: --:-- - --:--</div>

      <button id="startBtn" class="primary-btn">Start Exam Clock</button>
    </div>

    <!-- Active Timer Display Section -->
    <div id="timerPanel">
      <div class="timer-layout" id="timerLayout">
        <!-- Part 1: Maximized Clock -->
        <div class="part-clock">
          <div class="clock-wrapper">
            <svg class="real-clock" viewBox="0 0 100 100">
              <circle cx="50" cy="50" r="47" fill="none" stroke="none"/>
              <line id="hourHand" x1="50" y1="50" x2="50" y2="28" stroke="#222" stroke-width="4" stroke-linecap="round"/>
              <line id="minuteHand" x1="50" y1="50" x2="50" y2="18" stroke="#0066cc" stroke-width="3" stroke-linecap="round"/>
              <line id="secondHand" x1="50" y1="50" x2="50" y2="12" stroke="#d9534f" stroke-width="1.5"/>
              <circle cx="50" cy="50" r="3.5" fill="#222"/>
            </svg>
          </div>
        </div>

        <!-- Part 2: Info & Controls -->
        <div class="part-info">
          <!-- Status badge -->
          <div class="status-badge-container">
            <div id="statusBadge" class="status-badge status-waiting">Waiting to start</div>
          </div>

          <!-- Exam Period text -->
          <div class="time-range" id="examTimeRange">Exam Period: --:-- - --:--</div>

          <!-- Real-time XX:XX:XX -->
          <div class="real-time-container">
            <div class="real-time" id="realTimeDisplay">00:00:00</div>
          </div>

          <!-- Countdown display -->
          <div class="countdown-container">
            <div class="countdown-display" id="countdownDisplay"></div>
          </div>

          <!-- Active Timer Controls -->
          <div class="timer-controls">
            <label class="checkbox-label">
              <input type="checkbox" id="timerRealTime" checked>
              Show real-time (HH:MM:SS)
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="timerCountdown">
              Show remaining time countdown
            </label>
            <label class="checkbox-label" id="timerFifteenMinLabel">
              <input type="checkbox" id="timerAnnounce15Min">
              15 mins left announce
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Elements
    const mainContainer = document.getElementById('mainContainer');
    const mainHeader = document.getElementById('mainHeader');
    const setupPanel = document.getElementById('setupPanel');
    const timerPanel = document.getElementById('timerPanel');
    const timerLayout = document.getElementById('timerLayout');

    const startHoursInput = document.getElementById('startHours');
    const startMinutesInput = document.getElementById('startMinutes');
    const startSecondsInput = document.getElementById('startSeconds');

    const durationHoursInput = document.getElementById('durationHours');
    const durationMinutesInput = document.getElementById('durationMinutes');

    const schedulePreview = document.getElementById('schedulePreview');
    const timeError = document.getElementById('timeError');
    const startBtn = document.getElementById('startBtn');

    // Checkboxes
    const setupRealTime = document.getElementById('setupRealTime');
    const setupCountdown = document.getElementById('setupCountdown');
    const announce15Min = document.getElementById('announce15Min');
    const fifteenMinLabel = document.getElementById('fifteenMinLabel');

    const timerRealTime = document.getElementById('timerRealTime');
    const timerCountdown = document.getElementById('timerCountdown');
    const timerAnnounce15Min = document.getElementById('timerAnnounce15Min');
    const timerFifteenMinLabel = document.getElementById('timerFifteenMinLabel');

    // Displays
    const realTimeDisplay = document.getElementById('realTimeDisplay');
    const examTimeRange = document.getElementById('examTimeRange');
    const countdownDisplay = document.getElementById('countdownDisplay');
    const statusBadge = document.getElementById('statusBadge');

    // Clock Hands
    const hourHand = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');

    let examStart = null;
    let examEnd = null;
    let timerInterval = null;
    let bellRung = false;
    let startAnnounced = false;
    let announcement15Triggered = false;
    let announcement5Triggered = false;

    /**
     * Web Size Layout Detector
     * Uses window.innerWidth and window.innerHeight from index.html
     */
    function updateClockPosition() {
      const webWidth = window.innerWidth;
      const webHeight = window.innerHeight;

      // Web Width > Web Height => Clock Left (row)
      // Web Width <= Web Height => Clock Up (column)
      if (webWidth > webHeight) {
        timerLayout.style.flexDirection = 'row';
      } else {
        timerLayout.style.flexDirection = 'column';
      }
    }

    // Web Size Event Listeners (Matching index.html implementation)
    window.addEventListener('load', updateClockPosition);
    window.addEventListener('resize', updateClockPosition);

    // Sync Checkboxes between Setup and Timer controls
    setupRealTime.addEventListener('change', () => { timerRealTime.checked = setupRealTime.checked; });
    setupCountdown.addEventListener('change', () => { timerCountdown.checked = setupCountdown.checked; });
    announce15Min.addEventListener('change', () => { timerAnnounce15Min.checked = announce15Min.checked; });

    timerRealTime.addEventListener('change', () => { setupRealTime.checked = timerRealTime.checked; tick(); });
    timerCountdown.addEventListener('change', () => { setupCountdown.checked = timerCountdown.checked; tick(); });
    timerAnnounce15Min.addEventListener('change', () => { announce15Min.checked = timerAnnounce15Min.checked; });

    // Toggle 00 or 30 seconds
    function toggleHalfMinute() {
      startSecondsInput.value = startSecondsInput.value === "00" ? "30" : "00";
      updatePreview();
    }

    // Adjust values via arrow buttons
    function adjustValue(inputId, delta) {
      const input = document.getElementById(inputId);
      let val = (parseInt(input.value, 10) || 0) + delta;
      input.value = val;
      normalizeInputs();
    }

    // Auto Normalization
    function normalizeInputs() {
      let sH = parseInt(startHoursInput.value, 10) || 0;
      let sM = parseInt(startMinutesInput.value, 10) || 0;
      let dH = parseInt(durationHoursInput.value, 10) || 0;
      let dM = parseInt(durationMinutesInput.value, 10) || 0;

      if (sM >= 60) {
        sH += Math.floor(sM / 60);
        sM = sM % 60;
      } else if (sM < 0) {
        sM = 0;
      }

      sH = ((sH % 24) + 24) % 24;

      if (dM >= 60) {
        dH += Math.floor(dM / 60);
        dM = dM % 60;
      } else if (dM < 0) {
        dM = 0;
      }

      if (dH < 0) dH = 0;

      startHoursInput.value = String(sH).padStart(2, '0');
      startMinutesInput.value = String(sM).padStart(2, '0');
      durationHoursInput.value = String(dH);
      durationMinutesInput.value = String(dM).padStart(2, '0');

      // Check duration rule for 15 mins left announce (>= 16 mins required)
      const totalMins = (dH * 60) + dM;
      if (totalMins < 16) {
        announce15Min.checked = false;
        announce15Min.disabled = true;
        fifteenMinLabel.classList.add('disabled');

        timerAnnounce15Min.checked = false;
        timerAnnounce15Min.disabled = true;
        timerFifteenMinLabel.classList.add('disabled');
      } else {
        announce15Min.disabled = false;
        fifteenMinLabel.classList.remove('disabled');

        timerAnnounce15Min.disabled = false;
        timerFifteenMinLabel.classList.remove('disabled');
      }

      updatePreview();
    }

    function setInitialStartTime() {
      const now = new Date();
      now.setMinutes(now.getMinutes() + 1);
      startHoursInput.value = String(now.getHours()).padStart(2, '0');
      startMinutesInput.value = String(now.getMinutes()).padStart(2, '0');
      startSecondsInput.value = "00";
      normalizeInputs();
    }

    function formatTimeString(date) {
      return date.toTimeString().split(' ')[0];
    }

    function formatShortTime(date) {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = date.getSeconds();
      return s > 0 ? `${h}:${m}:${String(s).padStart(2, '0')}` : `${h}:${m}`;
    }

    // Convert Date object to spoken words
    function timeToSpokenWords(date) {
      const hours = date.getHours();
      const minutes = date.getMinutes();
      const seconds = date.getSeconds();

      const hourNames = ["Twelve", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven"];
      const hourStr = hourNames[hours % 12];

      const tens = ["", "", "twenty", "thirty", "forty", "fifty"];
      const ones = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine",
                    "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];

      let minuteStr = "";
      if (minutes === 0) {
        minuteStr = "o'clock";
      } else if (minutes < 20) {
        minuteStr = (minutes < 10 ? "oh " : "") + ones[minutes];
      } else {
        const t = Math.floor(minutes / 10);
        const o = minutes % 10;
        minuteStr = tens[t] + (o > 0 ? " " + ones[o] : "");
      }

      const secondStr = seconds === 30 ? " thirty" : "";

      return `${hourStr} ${minuteStr}${secondStr}`.trim();
    }

    // Speech Synthesis helper
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Audio File Player helper
    function playAudioFile(filename) {
      const audio = new Audio(filename);
      audio.play().catch(e => console.log("Audio file play blocked or not found:", filename, e));
    }

    function getExamDates() {
      const sH = parseInt(startHoursInput.value, 10) || 0;
      const sM = parseInt(startMinutesInput.value, 10) || 0;
      const sS = parseInt(startSecondsInput.value, 10) || 0;
      const dH = parseInt(durationHoursInput.value, 10) || 0;
      const dM = parseInt(durationMinutesInput.value, 10) || 0;

      const totalDurationMins = (dH * 60) + dM;

      const start = new Date();
      start.setHours(sH, sM, sS, 0);

      const end = new Date(start.getTime() + totalDurationMins * 60000);

      return { start, end };
    }

    function updatePreview() {
      const { start, end } = getExamDates();
      schedulePreview.textContent = `Exam Period: ${formatShortTime(start)} - ${formatShortTime(end)}`;
    }

    function ringBell() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        gain.gain.setValueAtTime(1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 3);
      } catch (e) {
        console.log("Audio play error", e);
      }
    }

    function updateAnalogClock(now) {
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      const secDeg = seconds * 6;
      const minDeg = (minutes + seconds / 60) * 6;
      const hourDeg = ((hours % 12) + minutes / 60) * 30;

      secondHand.setAttribute('transform', `rotate(${secDeg}, 50, 50)`);
      minuteHand.setAttribute('transform', `rotate(${minDeg}, 50, 50)`);
      hourHand.setAttribute('transform', `rotate(${hourDeg}, 50, 50)`);
    }

    function startTimer() {
      normalizeInputs();

      const now = new Date();
      const { start, end } = getExamDates();

      if (start <= now) {
        timeError.style.display = 'block';
        return;
      }

      timeError.style.display = 'none';
      examStart = start;
      examEnd = end;
      bellRung = false;
      startAnnounced = false;
      announcement15Triggered = false;
      announcement5Triggered = false;

      setupPanel.style.display = 'none';
      mainHeader.style.display = 'none';
      timerPanel.style.display = 'block';

      // Remove card wrapper completely and set pure white full screen
      document.body.classList.add('timer-active');
      mainContainer.classList.add('timer-active');

      // Update layout orientation based on current Web Size
      updateClockPosition();

      examTimeRange.textContent = `Exam Period: ${formatShortTime(examStart)} - ${formatShortTime(examEnd)}`;

      tick();
      timerInterval = setInterval(tick, 1000);
    }

    function tick() {
      const now = new Date();

      updateAnalogClock(now);

      if (timerRealTime.checked) {
        realTimeDisplay.classList.remove('invisible');
        realTimeDisplay.textContent = formatTimeString(now);
      } else {
        realTimeDisplay.classList.add('invisible');
      }

      const isCountdownVisible = timerCountdown.checked;

      if (now < examStart) {
        statusBadge.textContent = "Waiting to start";
        statusBadge.className = "status-badge status-waiting";
        if (isCountdownVisible) {
          countdownDisplay.classList.remove('invisible');
          const diffMs = examStart - now;
          countdownDisplay.textContent = `Starts in ${formatDuration(diffMs)}`;
        } else {
          countdownDisplay.classList.add('invisible');
        }
      } else if (now >= examStart && now < examEnd) {
        statusBadge.textContent = "Exam in progress";
        statusBadge.className = "status-badge status-running";

        // Speak Start Announcement ONCE when exam begins
        if (!startAnnounced) {
          startAnnounced = true;
          const nowSpoken = timeToSpokenWords(examStart);
          const finishSpoken = timeToSpokenWords(examEnd);
          const startMessage = `The time now is ${nowSpoken}, the finishing time is ${finishSpoken}, you may start now.`;
          speakText(startMessage);
        }

        const remainingMs = examEnd - now;
        const remainingSeconds = Math.floor(remainingMs / 1000);

        // Check 15 mins left announce (Only play if ticked)
        if (timerAnnounce15Min.checked && !announcement15Triggered && remainingSeconds <= 900 && remainingSeconds > 895) {
          announcement15Triggered = true;
          playAudioFile('15_mins_left.mp3');
        }

        // Check 5 mins left announce (Only play if ticked)
        if (timerAnnounce15Min.checked && !announcement5Triggered && remainingSeconds <= 300 && remainingSeconds > 295) {
          announcement5Triggered = true;
          playAudioFile('5_mins_left.mp3');
        }

        if (isCountdownVisible) {
          countdownDisplay.classList.remove('invisible');
          countdownDisplay.textContent = `You have ${formatDuration(remainingMs)} left`;
        } else {
          countdownDisplay.classList.add('invisible');
        }
      } else {
        statusBadge.textContent = "Exam Completed";
        statusBadge.className = "status-badge status-ended";
        
        if (isCountdownVisible) {
          countdownDisplay.classList.remove('invisible');
          countdownDisplay.textContent = "Time's up!";
        } else {
          countdownDisplay.classList.add('invisible');
        }

        // Ring Bell ONCE and Speak End Announcement
        if (!bellRung) {
          ringBell();
          const endMessage = "Time is up, stop working, put down all your stationery.";
          speakText(endMessage);
          bellRung = true;
        }
      }
    }

    function formatDuration(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const h = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
      const s = String(totalSeconds % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    // Input listeners
    [startHoursInput, startMinutesInput, durationHoursInput, durationMinutesInput].forEach(input => {
      input.addEventListener('change', normalizeInputs);
      input.addEventListener('blur', normalizeInputs);
      input.addEventListener('input', updatePreview);
    });

    startBtn.addEventListener('click', startTimer);

    // Initial setup
    setInitialStartTime();
  </script>
</body>
</html>
